  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;

              const { done, value } = await reader.read();

              chunks.push(value);

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // file:// document inherit a null origin, so crossorigin forces a CORS

    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.

        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';

      // would push the parser into quirks mode. DOMParser always emits a <head>

      }

    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting

        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();

        }

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

rc: url(\"da953e5d-52df-4860-b728-6962b240af71\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"95b1f851-ed42-4552-8d52-e2a0d69fe5cd\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"962fcab6-f89d-44b5-b063-4f8aaf6f39de\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #fff; font-family: 'Hanken Grotesk', system-ui, sans-serif; }\n  .doc { box-sizing: border-box; max-width: 8.5in; margin: 0 auto; background: inherit; padding: 0 0 96px; }\n  .doc-frame { width: 100%; border-collapse: collapse; }\n  .doc-frame td { padding: 0; }\n  .running-hdr, .running-ftr, .hdr-space, .ftr-space { display: none; }\n  h1, h2, h3 { text-wrap: balance; margin: 0; }\n  p, li { text-wrap: pretty; }\n  a { color: inherit; }\n  .pad { padding: 0 clamp(24px, 5vw, 0.75in); }\n  @page { size: letter; margin: 0; }\n  @media print {\n    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    html, body { margin: 0; padding: 0; }\n    .doc { max-width: none !important; margin: 0 !important; padding: 0 0 0 0 !important; box-shadow: none !important; border: none !important; }\n    .pad { padding: 0 0.62in !important; }\n    #dc-root, .sc-host { height: auto !important; }\n    .hdr-space, .ftr-space { display: table-cell; height: 0.62in !important; }\n    .running-hdr, .running-ftr { display: flex !important; justify-content: space-between; align-items: baseline; position: fixed !important; left: 0; right: 0; margin: 0 !important; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a; font-family: 'Hanken Grotesk', sans-serif; }\n    .running-hdr { top: 0; padding: 0.3in 0.62in 0 !important; }\n    .running-ftr { bottom: 0; padding: 0 0.62in 0.3in !important; }\n    h1, h2, h3, h4, h5, h6 { break-after: avoid; }\n    .callout, .pcard, .faq-item, .reason, .tip, figure, blockquote, tr { break-inside: avoid; }\n    p, li { orphans: 3; widows: 3; }\n    .screen-only { display: none !important; }\n    .masthead { padding-top: 0.3in !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<main class=\"doc\">\n  <table class=\"doc-frame\" role=\"presentation\">\n    <thead><tr><td class=\"hdr-space\"><\u002Ftd><\u002Ftr><\u002Fthead>\n    <tbody><tr><td>\n\n      <div class=\"running-hdr\"><span>Herts Signs &amp; Graphics Ltd<\u002Fspan><span>Designing with AI — Customer Guide<\u002Fspan><\u002Fdiv>\n      <div class=\"running-ftr\"><span>sales@hertssigns.co.uk<\u002Fspan><span>Signage · Vehicle Graphics · Wraps<\u002Fspan><\u002Fdiv>\n\n      <!-- MASTHEAD -->\n      <div class=\"masthead pad\" style=\"background:#161616; padding-top:34px; padding-bottom:30px; position:relative;\">\n        <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;\">\n          <img src=\"79b48271-456a-4b38-82b6-982870f89fd7\" alt=\"Herts Signs &amp; Graphics\" style=\"height:62px; width:auto; display:block;\">\n          <div style=\"font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; color:#9a9a9a; font-weight:600; text-align:right; line-height:1.7; padding-bottom:6px;\">Signage · Vehicle Graphics<br>Wraps · Banners · Exhibition<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:6px; border-radius:3px; margin-top:26px; background:linear-gradient(90deg,#e6197f,#7b2d9f 18%,#2f64b3 36%,#138f93 50%,#18a050 62%,#cfd61a 72%,#f59a1a 82%,#e21f26 92%,#c4187a);\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- TITLE -->\n      <div class=\"pad\" style=\"padding-top:42px;\">\n        <div style=\"font-family:'Anton',sans-serif; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#a23; background:linear-gradient(90deg,#e6197f,#2f64b3,#18a050,#f59a1a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; margin-bottom:14px;\">A Customer Guide<\u002Fdiv>\n        <h1 style=\"font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(34px,6vw,52px); line-height:1.0; text-transform:uppercase; color:#161616; letter-spacing:0.005em;\">Designing with AI:<br>Logos &amp; Vehicle Graphics<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.6; color:#3a3a3a; margin:22px 0 0; max-width:60ch;\">AI image tools — like ChatGPT, Midjourney, Gemini and others — are a brilliant way to explore ideas for your logo or vehicle livery before committing. They’re fast, fun and great for sparking inspiration. This guide shows you how to get the most useful results, and explains clearly where AI stops and our design team takes over.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- READ THIS FIRST CALLOUT -->\n      <div class=\"pad\" style=\"margin-top:30px;\">\n        <div class=\"callout\" style=\"border:1px solid #e4e3e0; border-radius:10px; overflow:hidden; background:#faf9f7;\">\n          <div style=\"height:6px; background:linear-gradient(90deg,#e6197f,#7b2d9f 18%,#2f64b3 36%,#138f93 50%,#18a050 62%,#cfd61a 72%,#f59a1a 82%,#e21f26 92%,#c4187a);\"><\u002Fdiv>\n          <div style=\"padding:22px 26px 24px;\">\n            <div style=\"font-family:'Anton',sans-serif; font-size:20px; text-transform:uppercase; letter-spacing:0.02em; color:#161616; margin-bottom:8px;\">Read this first<\u002Fdiv>\n            <p style=\"font-size:15.5px; line-height:1.62; color:#2b2b2b; margin:0;\"><strong style=\"font-weight:700;\">AI images are a guideline, not finished artwork.<\u002Fstrong> Anything an AI generates is a visual starting point — a way to show us the direction you like. For anything we print or apply, and especially for vehicles, signage and large-format work, our designers will need to recreate the artwork properly from scratch. We’ll explain exactly why further down.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 01 -->\n      <div class=\"pad\" style=\"margin-top:40px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#e6197f,#7b2d9f);\">01<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">Think of AI as a sketchpad<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:0 0 12px;\">AI generators are at their best when you treat them like a quick, tireless sketch artist. Use them to explore directions and gather references — not to produce the final thing. They’re great for:<\u002Fp>\n        <ul style=\"font-size:15px; line-height:1.6; color:#2b2b2b; margin:0; padding-left:22px;\">\n          <li style=\"margin-bottom:6px;\">Trying out colour combinations and overall “feel”<\u002Fli>\n          <li style=\"margin-bottom:6px;\">Exploring visual styles — minimal, bold, vintage, hand-drawn<\u002Fli>\n          <li style=\"margin-bottom:6px;\">Seeing rough layouts and where things might sit<\u002Fli>\n          <li style=\"margin-bottom:0;\">Building a mini mood-board to share with us<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:12px 0 0;\">When you send us the results, you’re showing us the direction you like — which is the perfect way to start a project.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- SECTION 02 -->\n      <div class=\"pad\" style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#2f64b3,#138f93);\">02<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">How to write a good prompt<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:0 0 16px;\">The clearer your instructions, the more useful the result. A strong prompt usually covers six things:<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:10px;\">\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#2f64b3; margin-bottom:3px;\">Subject<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">What it is — “a logo for a plumbing company”<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#e6197f; margin-bottom:3px;\">Style<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">Flat, minimal, vintage, geometric, hand-drawn<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#18a050; margin-bottom:3px;\">Colours<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">Name them — “navy blue and warm grey”<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#f59a1a; margin-bottom:3px;\">Mood<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">Professional, playful, bold, premium<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#7b2d9f; margin-bottom:3px;\">Details<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">A symbol, an initial, an icon idea<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #ece9e4; border-radius:8px; padding:13px 15px; background:#fff;\"><div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#e21f26; margin-bottom:3px;\">Format<\u002Fdiv><div style=\"font-size:13.5px; color:#3a3a3a; line-height:1.45;\">“Simple vector-style logo on a white background”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px; background:#161616; border-radius:10px; padding:18px 22px;\">\n          <div style=\"font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:#9a9a9a; margin-bottom:8px;\">Put together, that becomes…<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; line-height:1.6; color:#f3f3f3;\">“A minimal, modern logo for <span style=\"color:#5fd0d6;\">Crisp Plumbing<\u002Fspan>, featuring a simple water-drop icon, in navy blue and silver-grey, flat vector style, on a white background — professional and trustworthy.”<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 03 - LOGO PROMPTS -->\n      <div class=\"pad\" style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#18a050,#cfd61a);\">03<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">Example prompts — logos<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:0 0 16px;\">Copy these as a starting point and swap in your own business name, colours and ideas.<\u002Fp>\n\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:11px; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#18a050,#cfd61a);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“A clean, minimal logo for a coffee shop called The Daily Grind, with a simple coffee-bean icon, in dark brown and cream, flat geometric style, on a white background.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:11px; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#18a050,#cfd61a);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“A bold, modern logo for Apex Fitness using a strong abstract mountain symbol, in black and electric orange, no gradients, simple vector style.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:0; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#18a050,#cfd61a);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“A friendly, hand-drawn logo for Bloom Florist, featuring a single line-art flower, in sage green and blush pink, simple and elegant, on a plain background.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 04 - VEHICLE PROMPTS -->\n      <div class=\"pad\" style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#f59a1a,#e21f26);\">04<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">Example prompts — vehicle graphics<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:0 0 16px;\">Asking for a <strong>side-profile view on a plain background<\u002Fstrong> makes concepts far easier for us to work from.<\u002Fp>\n\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:11px; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#f59a1a,#e21f26);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“Side view of a white Ford Transit van with a professional vehicle wrap for an electrician, in blue and yellow, clean modern layout with a clear space for the company name, plain background.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:11px; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#f59a1a,#e21f26);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“A sleek vehicle livery concept for a black Mercedes Sprinter van, dynamic diagonal stripes in red and grey, modern and premium, side profile on a plain background.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcard\" style=\"display:flex; gap:14px; border:1px solid #e4e3e0; border-radius:9px; padding:15px 17px; margin-bottom:14px; background:#fff;\">\n          <div style=\"flex:none; width:5px; border-radius:3px; background:linear-gradient(180deg,#f59a1a,#e21f26);\"><\u002Fdiv>\n          <div><div style=\"font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.55; color:#222;\">“A bright, eye-catching wrap concept for a small café delivery car, warm orange and brown, playful and welcoming, side view on a plain background.”<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.55; color:#6b6b6b; margin:0; font-style:italic;\">Don’t worry about getting your real phone number, web address or accreditation logos into the image — we’ll add those properly when we build the production artwork.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- SECTION 05 - TIPS -->\n      <div class=\"pad\" style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#7b2d9f,#2f64b3);\">05<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">Tips for the best results<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px 22px;\">\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#18a050;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Be specific.<\u002Fstrong> More detail almost always gives a more useful result.<\u002Fp><\u002Fdiv>\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#2f64b3;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Name your colours<\u002Fstrong> rather than leaving the AI to guess.<\u002Fp><\u002Fdiv>\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#e6197f;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Ask for “flat”, “simple”, “vector style”<\u002Fstrong> for logos — cleaner art is easier to recreate.<\u002Fp><\u002Fdiv>\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#f59a1a;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Keep text out of it.<\u002Fstrong> AI is famously bad at spelling — describe where the name goes instead.<\u002Fp><\u002Fdiv>\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#7b2d9f;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Generate several<\u002Fstrong> and keep your favourites side by side.<\u002Fp><\u002Fdiv>\n          <div class=\"tip\" style=\"display:flex; gap:10px;\"><div style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; background:#e21f26;\"><\u002Fdiv><p style=\"font-size:14.5px; line-height:1.5; color:#2b2b2b; margin:0;\"><strong>Show us what you like<\u002Fstrong> — and tell us what you’d change.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 06 - PITFALLS -->\n      <div class=\"pad\" style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#c4187a,#e6197f);\">06<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">Pitfalls to avoid<\u002Fh2>\n        <\u002Fdiv>\n        <ul style=\"font-size:15px; line-height:1.55; color:#2b2b2b; margin:0; padding-left:22px;\">\n          <li style=\"margin-bottom:8px;\"><strong>Don’t expect print-ready files.<\u002Fstrong> Downloads and screenshots are low-resolution and can’t be printed at large sizes.<\u002Fli>\n          <li style=\"margin-bottom:8px;\"><strong>Don’t trust the spelling.<\u002Fstrong> Any text the AI adds is usually wrong — treat it as a placeholder only.<\u002Fli>\n          <li style=\"margin-bottom:8px;\"><strong>Don’t assume the colours are accurate.<\u002Fstrong> On-screen colours rarely match printed vinyl.<\u002Fli>\n          <li style=\"margin-bottom:8px;\"><strong>Avoid overly busy, detailed images.<\u002Fstrong> Fine detail and photo-realistic effects don’t reproduce well in large-format vinyl.<\u002Fli>\n          <li style=\"margin-bottom:0;\"><strong>Steer clear of other brands.<\u002Fstrong> If a result includes a real company’s logo or a familiar character, we can’t use it — it isn’t yours to print.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- SECTION 07 - GUIDELINE ONLY (FEATURE) -->\n      <div class=\"pad\" style=\"margin-top:38px;\">\n        <div style=\"background:#161616; border-radius:12px; padding:26px 28px 28px;\">\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:6px;\">\n            <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#161616; background:linear-gradient(135deg,#cfd61a,#f59a1a);\">07<\u002Fdiv>\n            <h2 style=\"font-size:22px; font-weight:800; color:#fff; letter-spacing:-0.01em;\">Why AI artwork is a guideline only<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.62; color:#d8d8d8; margin:4px 0 20px;\">This is the most important part. An AI image can capture a look you love — but it can’t go straight onto a van or a sign. Here’s why our designers always rebuild it:<\u002Fp>\n          <div class=\"reason\" style=\"border-top:1px solid #333; padding:14px 0;\"><div style=\"font-weight:700; color:#fff; font-size:14.5px; margin-bottom:3px;\">It’s a pixel image, not vector art<\u002Fdiv><p style=\"font-size:13.5px; line-height:1.55; color:#bdbdbd; margin:0;\">AI produces fixed-resolution pixels. Signage and wraps need vector artwork that stays razor-sharp at any size — even metres long. Blow a pixel image up to van size and it turns blurry and jagged.<\u002Fp><\u002Fdiv>\n          <div class=\"reason\" style=\"border-top:1px solid #333; padding:14px 0;\"><div style=\"font-weight:700; color:#fff; font-size:14.5px; margin-bottom:3px;\">Colours have to be matched for print<\u002Fdiv><p style=\"font-size:13.5px; line-height:1.55; color:#bdbdbd; margin:0;\">Screen colours (RGB) don’t translate directly to printed vinyl (CMYK and Pantone). We colour-match to your brand and to the materials we’re using.<\u002Fp><\u002Fdiv>\n          <div class=\"reason\" style=\"border-top:1px solid #333; padding:14px 0;\"><div style=\"font-weight:700; color:#fff; font-size:14.5px; margin-bottom:3px;\">Real fonts and correct text<\u002Fdiv><p style=\"font-size:13.5px; line-height:1.55; color:#bdbdbd; margin:0;\">AI can’t use licensed fonts and frequently misspells. We set your name and details in proper, legible, licensed type.<\u002Fp><\u002Fdiv>\n          <div class=\"reason\" style=\"border-top:1px solid #333; padding:14px 0;\"><div style=\"font-weight:700; color:#fff; font-size:14.5px; margin-bottom:3px;\">It must fit your actual vehicle or sign<\u002Fdiv><p style=\"font-size:13.5px; line-height:1.55; color:#bdbdbd; margin:0;\">Vehicle graphics have to be designed around the real doors, panels, curves and windows of your specific vehicle — something a generic AI image never accounts for.<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid #333; padding-top:16px; margin-top:2px;\">\n            <p style=\"font-size:14.5px; line-height:1.55; color:#fff; margin:0;\"><strong>In short:<\u002Fstrong> think of the AI image as a detailed sketch. We turn that sketch into polished, production-ready artwork built to last.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 08 - DIFFERENT EVERY TIME -->\n      <div class=\"pad\" style=\"margin-top:36px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#138f93,#2f64b3);\">08<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">You’ll get a different result every time<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.62; color:#2b2b2b; margin:0 0 12px;\">AI tools are random by design. Run the very same prompt twice and you’ll get two different images — different layouts, colours and details each time. There’s no button to “make that exact one again”.<\u002Fp>\n        <div style=\"background:#faf9f7; border:1px solid #e4e3e0; border-left:5px solid #138f93; border-radius:8px; padding:15px 18px;\">\n          <p style=\"font-size:14.5px; line-height:1.55; color:#2b2b2b; margin:0;\">So when you find one you love, <strong>save or screenshot it straight away<\u002Fstrong> and send it over. That single image becomes the reference for your final design — otherwise it may be gone for good.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 09 - FAQ -->\n      <div class=\"pad\" style=\"margin-top:36px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:16px;\">\n          <div style=\"flex:none; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:18px; color:#fff; background:linear-gradient(135deg,#e6197f,#f59a1a);\">09<\u002Fdiv>\n          <h2 style=\"font-size:22px; font-weight:800; color:#161616; letter-spacing:-0.01em;\">A few common questions<\u002Fh2>\n        <\u002Fdiv>\n\n        <div class=\"faq-item\" style=\"border-top:1px solid #e4e3e0; padding:14px 0;\">\n          <div style=\"font-size:15px; font-weight:700; color:#161616; margin-bottom:5px;\">Can I just use the AI image on my van?<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.55; color:#3a3a3a; margin:0;\">Not directly — it needs to be recreated as proper print-ready vector artwork first. Think of the AI image as the brief; we make the real thing.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"faq-item\" style=\"border-top:1px solid #e4e3e0; padding:14px 0;\">\n          <div style=\"font-size:15px; font-weight:700; color:#161616; margin-bottom:5px;\">Will the final design look exactly like the AI image?<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.55; color:#3a3a3a; margin:0;\">It will capture the same idea, style and colours — but cleaner, sharper and built to fit your vehicle or sign. More often than not, it ends up looking even better.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"faq-item\" style=\"border-top:1px solid #e4e3e0; padding:14px 0;\">\n          <div style=\"font-size:15px; font-weight:700; color:#161616; margin-bottom:5px;\">Which AI tool should I use?<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.55; color:#3a3a3a; margin:0;\">Any of the popular ones are fine for ideas. The tool matters far less than a clear prompt and sharing what you like with us.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"faq-item\" style=\"border-top:1px solid #e4e3e0; padding:14px 0;\">\n          <div style=\"font-size:15px; font-weight:700; color:#161616; margin-bottom:5px;\">Can you help generate ideas with me?<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.55; color:#3a3a3a; margin:0;\">Absolutely. Tell us your thoughts and we’re happy to explore directions together — it’s what we do best.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CTA -->\n      <div class=\"pad\" style=\"margin-top:38px;\">\n        <div style=\"border-radius:12px; overflow:hidden; border:1px solid #e4e3e0;\">\n          <div style=\"height:6px; background:linear-gradient(90deg,#e6197f,#7b2d9f 18%,#2f64b3 36%,#138f93 50%,#18a050 62%,#cfd61a 72%,#f59a1a 82%,#e21f26 92%,#c4187a);\"><\u002Fdiv>\n          <div style=\"padding:24px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;\">\n            <div>\n              <div style=\"font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; color:#161616; letter-spacing:0.01em; margin-bottom:6px;\">Got an idea? Let’s talk<\u002Fdiv>\n              <p style=\"font-size:14.5px; line-height:1.55; color:#3a3a3a; margin:0; max-width:46ch;\">Send us the AI concepts you like and one of our designers will help turn them into the real thing — print-ready and built to last.<\u002Fp>\n            <\u002Fdiv>\n            <a href=\"mailto:sales@hertssigns.co.uk\" style=\"flex:none; text-decoration:none; background:#161616; color:#fff; font-weight:700; font-size:15px; padding:13px 22px; border-radius:8px; white-space:nowrap;\">sales@hertssigns.co.uk<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:11.5px; line-height:1.5; color:#9a9a9a; margin:16px 0 0; text-align:center;\">Herts Signs &amp; Graphics Ltd — Signage · Vehicle Graphics · Wraps · Banners · Exhibition<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Ftd><\u002Ftr><\u002Ftbody>\n    <tfoot><tr><td class=\"ftr-space\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n  <\u002Ftable>\n<\u002Fmain>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"AI Design Guide-standalone.dc"}
